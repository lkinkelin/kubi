apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ldap
  name: ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  strategy: {}
  template:
    metadata:
      labels:
        app: ldap
    spec:
      volumes: 
        - name: "ldapconfig"
          configMap:
            name: ldapconf
      containers:
      - image: bitnami/openldap
        name: openldap
        env:
        - name: LDAP_ROOT
          value: "dc=example,dc=org"
        volumeMounts:
        - name: ldapconfig
          mountPath: /ldifs
        resources: {}

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: ldap
  name: ldap
spec:
  ports:
  - port: 1389
    protocol: TCP
    targetPort: 1389
  selector:
    app: ldap
status:
  loadBalancer: {}
