kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
    - hostPath: test/e2e/conf/kubi/authentication-webhook.yml
      containerPath: /etc/kubernetes/additionnals/webhook.yml
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: authentication-token-webhook-config-file
          value: /etc/kubernetes/additionnals/webhook.yml